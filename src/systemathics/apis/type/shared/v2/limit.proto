// The market book limit data
syntax = "proto3";

import "google/protobuf/wrappers.proto";

import "systemathics/apis/type/shared/v2/quote.proto";
import "systemathics/apis/type/shared/v2/decimals.proto";

package systemathics.apis.type.shared.v2;

// The limit : bid or ask price and size at a given depth
message Limit
{
    // Size of the market book update (nullable, either Int64 or UnsignedDecimal)
    oneof size
    {
        google.protobuf.Int64Value size_value = 1;
        systemathics.apis.type.shared.v2.NullableUnsignedDecimal size_decimal_value= 2;
    }

    // Price of the market book update (nullable, either Double or SignedDecimal)
    oneof price
    {
        google.protobuf.DoubleValue price_value = 3;
        systemathics.apis.type.shared.v2.NullableSignedDecimal price_decimal_value = 4;
    }

	// The depth of the limit
	uint32 depth = 5;

	// The contributors
	repeated Quote quotes = 6;
}

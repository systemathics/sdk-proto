syntax = "proto3";

package systemathics.apis.type.shared.v2;

// Representation of a signed decimal (96 bits value and 0-28 scale, like C# decimal). We would like to have Decimal128 one day.
message SignedDecimal {
  // The actual unscaled value (can represent numbers with up to 29 significant digits)
  bytes unscaled_value = 1; // Stored as little-endian bytes
  
  // The scale factor (number of decimal places, 0-28)
  int32 scale = 2;
  
  // Sign indicator
  bool is_negative = 3;
}

// Nullable SignedDecimal
message NullableSignedDecimal {
  optional SignedDecimal value = 1;
}

// Representation of a signed decimal (96 bits value and 0-28 scale, like C# decimal). We would like to have Decimal128 one day.
message UnsignedDecimal {
  // The actual unscaled value (can represent numbers with up to 29 significant digits)
  bytes unscaled_value = 1; // Stored as little-endian bytes
  
  // The scale factor (number of decimal places)
  int32 scale = 2;  
}

// Nullable UnsignedDecimal
message NullableUnsignedDecimal {
  optional UnsignedDecimal value = 1;
}


// Raw tick by tick data is the primary data delivred by a specific data provider (exchange, third party, partner, in-house ...) and has not been processed or normalized yet.
// <br>Raw data can be useful to:
// <br>- Audit provider raw data reception and completion
// <br>- Compare provider's data formats
// <br>- Compare raw provider's format data to normalized (processsed) data
syntax = "proto3";

import "google/api/annotations.proto";
import "google/protobuf/wrappers.proto";

import "systemathics/apis/type/shared/v2/constraints.proto";
import "systemathics/apis/type/shared/v2/identifier.proto";
import "systemathics/apis/type/shared/v2/level.proto";
import "systemathics/apis/type/shared/v2/keys.proto";
import "systemathics/apis/type/shared/v2/raw.proto";

package systemathics.apis.services.tick.v2;

// Called to request tick by tick raw data.
service TickRawService 
{
	// Gets tick by tick raw data.
    rpc TickRaw(TickRawRequest) returns (stream TickRawResponse)
	{
	     option (google.api.http) = {
			get: "/v2/tick/raw"
		 };
	}
}

// The required inputs to request the TickRawService.
message TickRawRequest 
{
    // [Mandatory] The instruments and streams identifiers: a list of tickers, exchanges and streams.
	repeated systemathics.apis.type.shared.v2.Identifier identifiers = 1;

	// [Mandatory] The level.
    systemathics.apis.type.shared.v2.Level level = 2;

	// [Optional] The time constraints used to define the look-back period.
	// If empty, then all the available data is retrieved.
	systemathics.apis.type.shared.v2.Constraints constraints = 3;

	// [Optional] The size of the buffering window. Default is null (let the server side decide). If set to a value in [[1; 1024]] the buffer will be flushed once every that many items, potentially improving overall bandwidth performance.
	google.protobuf.Int32Value buffering_window_size = 4;
}

// Represents the raw data response.
message TickRawResponse
{
	oneof payload 
	{
		// The raw data
		systemathics.apis.type.shared.v2.Raw raw = 1;
		
		// The mapping data
		systemathics.apis.type.shared.v2.Keys mapping = 2;
	}
}

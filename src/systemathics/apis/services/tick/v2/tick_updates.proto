// Normalized tick by tick data updates:
//<br>- Fields : open, close, trade, high ...
//<br>- MBL : Market Book by Limit (contains the depth information)
//<br>- MBO : Market Book by Order (contains the quotes or order details)
syntax = "proto3";

import "google/api/annotations.proto";
import "google/protobuf/wrappers.proto";

import "systemathics/apis/type/shared/v2/constraints.proto";
import "systemathics/apis/type/shared/v2/keys.proto";
import "systemathics/apis/type/shared/v2/identifier.proto";
import "systemathics/apis/type/shared/v2/level.proto";
import "systemathics/apis/type/shared/v2/market_fields_updates.proto";
import "systemathics/apis/type/shared/v2/mbl_market_book_updates.proto";
import "systemathics/apis/type/shared/v2/mbo_market_book_updates.proto";

package systemathics.apis.services.tick.v2;

// Called to request tick by tick normalized historical data.
service TickUpdatesService 
{
    // Get tick by tick normalized historical Updates 
    rpc TickUpdates(TickUpdatesRequest) returns (stream TickUpdatesResponse)
	{
	     option (google.api.http) = {
			get: "/v2/tick/updates"
		 };
	}
}

// The required inputs to request the TickUpdatesService.
message TickUpdatesRequest
{
	// [Mandatory] The instrument and streams identifiers: a list of tickers and exchanges and streams
    repeated systemathics.apis.type.shared.v2.Identifier identifiers = 1;

    // [Mandatory] The level.
    systemathics.apis.type.shared.v2.Level level = 2;
        
    // [Optional] The time constraints used to define the look-back period.
	// If empty, then all the available data is retrieved.
    systemathics.apis.type.shared.v2.Constraints constraints = 3;

    // [Optional] The corporate action adjustment, by default the value is set to false
    bool adjustment = 4;

	// [Optional] The size of the buffering window. Default is null (let the server side decide). If set to a value in [[1; 1024]] the buffer will be flushed once every that many items, potentially improving overall bandwidth performance.
	google.protobuf.Int32Value buffering_window_size = 5;
}

// Contains the tick by tick normalized historical data.
message TickUpdatesResponse 
{    
    // Payload: that can be a mapping (event source and instrument identifier), the fields update or the books update
    oneof payload 
    {
        // The fields update
        systemathics.apis.type.shared.v2.MarketFieldsUpdates fields_updates = 1;
        
        // The MBL books update
        systemathics.apis.type.shared.v2.MblMarketBookUpdates mbl_book_updates = 2;
        
        // The MBO books update
        systemathics.apis.type.shared.v2.MboMarketBookUpdates mbo_book_updates = 3;

        // The mapping data
        systemathics.apis.type.shared.v2.Keys mapping = 4;
    }
}

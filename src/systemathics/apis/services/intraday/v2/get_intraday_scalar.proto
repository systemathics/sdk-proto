// Intraday prices illustrates intraday price movements for an instrument over a look back period.
syntax = "proto3";


import "google/protobuf/empty.proto";
import "google/api/annotations.proto";
import "google/type/datetime.proto";
import "google/protobuf/struct.proto";

import "systemathics/apis/type/shared/v1/asset.proto";
import "systemathics/apis/type/shared/v1/identifier.proto";
import "systemathics/apis/type/shared/v1/date_interval.proto";
import "systemathics/apis/type/shared/v1/sampling.proto";
import "systemathics/apis/type/shared/v1/constraints.proto";

package systemathics.apis.services.intraday.v2;

// Called to request intraday prices data. 
service IntradayService
{

  // Gets intraday historical data timeseries by identifier using streaming
  rpc IntradayScalarStream(IntradayRequest) returns (stream IntradayScalarStreamResponse)
  {
	  option (google.api.http) = {
			get: "/v2/intraday_scalar/"
	  };
  }


  // Gets intraday historical data timeseries by identifier using streaming
  rpc IntradayVectorStream(IntradayRequest) returns (stream IntradayVectorStreamResponse)
  {
	  option (google.api.http) = {
			get: "/v2/intraday_vector/"
	  };
  }

  // Gets intraday historical data timeseries by identifier and key using streaming
  rpc IntradayVectorKeyStream(IntradayVectorKeyRequest) returns (stream IntradayVectorStreamResponse)
  {
	  option (google.api.http) = {
			get: "/v2/intraday_vector_key/"
	  };
  }

  // Gets all available fields by asset and provider.
  rpc IntradayFields(google.protobuf.Empty) returns (IntradayFieldsResponse)
  {
	  option (google.api.http) = {
			get: "/v2/intraday_fields/"
	  };
  }

  // Gets all available provider by asset
  rpc IntradayAssetProviders(google.protobuf.Empty) returns (IntradayAssetProvidersResponse)
  {
	  option (google.api.http) = {
			get: "/v2/intraday_provider/"
	  };
  }
}

// The required input to request the GetIntradayByIdentifier endpoint
message IntradayRequest
{
	// [Mandatory] The instrument identifier: a bloomberg intradayer and an asset type 
	systemathics.apis.type.shared.v1.Identifier identifier = 1;

	// [Mandatory] The sampling interval
	systemathics.apis.type.shared.v1.Sampling sampling = 2;

	// [Mandatory] Fields/measures requested for intraday data
	repeated string fields = 3;

	// [Optional] The constraints used to define the look-back period.
	// If empty, then all the available data is retrieved.
	systemathics.apis.type.shared.v1.Constraints constraints = 4;
}


// The required input to request the IntradayVectorKeyStream endpoint
message IntradayVectorKeyRequest
{
	// [Mandatory] The instrument identifier: a bloomberg intradayer and an asset type 
	systemathics.apis.type.shared.v1.Identifier identifier = 1;

	// [Mandatory] The sampling interval
	systemathics.apis.type.shared.v1.Sampling sampling = 2;

	// [Mandatory] Fields/measures requested for daily data
	repeated string fields = 3;

	// [Mandatory] Key requested for daily data
	string key = 4;

	// [Optional] The constraints used to define the look-back period.
	// If empty, then all the available data is retrieved.
	systemathics.apis.type.shared.v1.Constraints constraints = 5;
}


// Represents the intraday scalar stream response.
message IntradayScalarStreamResponse
{
	oneof payload 
	{
		// The intraday fields. Issued in the first frame.
		IntradayStreamFields info = 1;
		
		// The mapping data. Issued in the following frames.
		IntradayScalarStreamItem data = 2;
	}
}


// Represents the intraday scalar stream response.
message IntradayVectorStreamResponse
{
	oneof payload 
	{
		// The intraday fields. Issued in the first frame.
		IntradayStreamFields info = 1;
		
		// The mapping data. Issued in the following frames.
		IntradayVectorStreamItem data = 2;
	}
}

// Represents all fields available in a intraday scalar stream response.
message IntradayStreamFields
{
	// The collection containing fields/measures values.
	repeated string fields = 1;
}


// Represents the data part of a intraday scalar stream response.
message IntradayScalarStreamItem
{
	// The data date.
    google.type.DateTime datetime = 1;

	// The data. Lenght of the array is the same as the fields.
	repeated double data = 2;
}

// Represents the data part of a intraday scalar stream response.
message IntradayVectorStreamItem
{
	// The data date.
    google.type.DateTime datetime = 1;

	// The vector key
	string key = 2;

	// The data. Lenght of the array is the same as the fields.
	repeated double data = 3;
}


// Represents a response containing an array of assets with all their providers
message IntradayAssetProvidersResponse
{
	// The asset type 
	repeated IntradayAssetProviderItemReponse assets = 1;
}

// Represents a links between an asset and a provider.
message IntradayAssetProviderItemReponse
{
	// The asset type 
	systemathics.apis.type.shared.v1.AssetType asset_type = 1;

	// The providers
	repeated string providers = 2;
}


message IntradayFieldsResponse
{
	// The collection containing items values for scalars.
	repeated IntradayFieldsItemResponse scalars = 1;

	// The collection containing items values for vectors.
	repeated IntradayFieldsItemResponse vectors = 2;
}

// Represents a links between an asset and a provider.
message IntradayFieldsItemResponse
{
	// The asset type 
	systemathics.apis.type.shared.v1.AssetType asset_type = 1;

	// [Mandatory] The sampling interval
	systemathics.apis.type.shared.v1.Sampling sampling = 2;

	// The provider
	string provider = 3;

	// The fields/measures
	repeated string fields = 4;
}

message StaticDataIdentifiers
{
    // [Mandatory] The Identifiers
    repeated StaticDataIdentifier identifiers = 1;
}
message StaticDataIdentifier
{
    // [Mandatory] Identifier
    systemathics.apis.type.shared.v1.Identifier identifier = 1;
    // [Optional] The date associated with identifier. Latest version is used if missing.
    google.type.Date date = 2;
}

// Contains the tick size rule item : price and tick.
message TickSize
{
	// The price level
	double price = 1;
	// The tick size
	double tick = 2;
}


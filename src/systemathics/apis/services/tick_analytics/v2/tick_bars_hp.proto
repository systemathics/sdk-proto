// Tick bars are widely used to illustrate price movements for an instrument over a look back period. 
// Commonly used in financial analysis and trading strategies as a technical indicator.
syntax = "proto3";

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/wrappers.proto";

import "systemathics/apis/type/shared/v2/constraints.proto";
import "systemathics/apis/type/shared/v2/identifier.proto";
import "systemathics/apis/type/shared/v2/price.proto";
import "systemathics/apis/type/shared/v2/decimals.proto";

package systemathics.apis.services.tick_analytics.v2;

// Called to request tick by tick bars data (high precision).
service HpTickBarsService 
{
    // Gets tick by tick bars data
    rpc HpTickBars(HpTickBarsRequest) returns (stream HpTickBarsResponse)
	{
	     option (google.api.http) = {
			get: "/v2/tick-analytics/hp-bars"
		 };
	}
}

// The required inputs to request the HpTickBarsService (high precision).
message HpTickBarsRequest 
{
    // [Mandatory] The instrument identifier: a ticker and exchange
	systemathics.apis.type.shared.v2.Identifier identifier = 1;

	// [Optional] The time constraints used to define the look-back period.
	// If empty, then all the available data is retrieved.
	systemathics.apis.type.shared.v2.Constraints constraints = 2;
    
    // [Optional] The price used to calculate the bar
	systemathics.apis.type.shared.v2.Price field = 3;

    // [Mandatory] The duration of the bar
	google.protobuf.Duration sampling = 4;
    
	// [Optional] The period of the bars, by default the period is set to one day
	google.protobuf.Duration period = 5;

	// [Optional] The offset time when the bars is reset, by default the offset is set to 00:00:00
	google.protobuf.Duration offset = 6;

	// [Optional] The corporate action adjustment, by default the value is set to false
	bool adjustment = 7;

	// [Optional] Accept trading / quote conditions, by default the accept is set to null : accept all
	repeated string accept = 8;

	// [Optional] Rejected trading / quote conditions, by default the reject is set to null : do not reject
	repeated string reject = 9;

	// [Optional] The size of the buffering window. Default is null (let the server side decide). If set to a value in [[1; 1024]] the buffer will be flushed once every that many items, potentially improving overall bandwidth performance.
	google.protobuf.Int32Value buffering_window_size = 10;
}

// Contains the tick bar's data: time, open, high, low, close, volume, count and vwap.
message HpTickBarsResponse
{
	// The time stamp
	google.protobuf.Timestamp time_stamp = 1;
	
	// count 
	uint64 count = 2;

	// Open price 
	systemathics.apis.type.shared.v2.SignedDecimal open = 3;
	
	// Highest price 
	systemathics.apis.type.shared.v2.SignedDecimal high = 4;
	
	// Lowest price 
	systemathics.apis.type.shared.v2.SignedDecimal low = 5;
	
	// Close price 
	systemathics.apis.type.shared.v2.SignedDecimal close = 6;
	
	// Total traded volume 
	systemathics.apis.type.shared.v2.UnsignedDecimal volume = 7;

	// Volume weighted average price 
	systemathics.apis.type.shared.v2.SignedDecimal vwap = 8;

	// Total frames processed up to now 
	google.protobuf.UInt64Value total_processed_frames = 9;
}
